<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ekwalizer header logo</title>
<!-- Source for the in-app header logo (mark + wordmark, transparent). Rendered at 3x to app/src/main/res/drawable-xxhdpi/logo_header.png (720x132 px = 240x44 dp). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&amp;display=swap">
<style>
html, body { margin: 0; background: transparent; }
body { width: 720px; height: 132px; display: flex; align-items: center; gap: 30px; overflow: hidden; }
img { width: 120px; height: 126px; }
.wm { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 88px; letter-spacing: -1px; line-height: 1; color: #2EC4B6; }
.wm .e { color: #FF9F1C; }
</style>
</head>
<body>
<img src="ekwalizer-mark.svg" alt="">
<div class="wm"><span class="e">e</span>kwalizer</div>
</body>
</html>
